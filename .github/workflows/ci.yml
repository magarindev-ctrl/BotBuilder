name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    name: 테스트 · 빌드 · dist 일치 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist가 소스에서 빌드한 결과와 같은지 확인
        run: |
          if ! git diff --exit-code --stat -- dist/risu_story_workshop.js; then
            echo "::error::dist/risu_story_workshop.js가 소스와 다릅니다. npm run build 결과를 커밋하세요."
            exit 1
          fi

  browser-verification:
    name: 브라우저 검증 (참고용)
    runs-on: ubuntu-latest
    needs: test-and-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright Chromium 설치
        run: npx playwright-core install --with-deps chromium
      - name: 모의 API 브라우저 검증
        run: |
          BROWSER="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          WORKSHOP_BROWSER="$BROWSER" node tools/verify-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
